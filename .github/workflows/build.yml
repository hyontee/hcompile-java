name: Build Java Android Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: 'gradle'

    - name: Validate Gradle Wrapper
      run: |
        if [ -f "gradlew" ]; then
          echo "Gradle wrapper found"
          ./gradlew --version
        else
          echo "ERROR: No gradlew found. Gradle Wrapper is required for this workflow."
          exit 1
        fi

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Clean project
      run: ./gradlew clean

    - name: Build Debug APK
      id: build
      run: |
        ./gradlew assembleDebug --stacktrace
        
        apk_files=$(find . -name "*.apk" -not -path "./buildSrc/*")
        
        if [ -n "$apk_files" ]; then
          apk_path=$(echo "$apk_files" | head -n 1)
          apk_name=$(basename "$apk_path")
          echo "APK_PATH=$apk_path" >> $GITHUB_ENV
          echo "APK_FOUND=true" >> $GITHUB_ENV
          echo "APK_NAME=$apk_name" >> $GITHUB_ENV
        else
          echo "APK_FOUND=false" >> $GITHUB_ENV
          exit 1
        fi

    - name: List build outputs
      if: env.APK_FOUND == 'true'
      run: |
        echo "Build outputs:"
        find . -name "*.apk" -type f

    - name: Upload Debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: |
          app/build/outputs/apk/**/*.apk
          */build/outputs/apk/**/*.apk
          **/build/outputs/apk/**/*.apk
        if-no-files-found: warn
        retention-days: 7